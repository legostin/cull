version: 2

release:
  mode: replace

builds:
  - binary: cull
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

nfpms:
  - package_name: cull
    vendor: legostin
    homepage: https://github.com/legostin/cull
    maintainer: legostin
    description: Interactive TUI disk space analyzer
    license: MIT
    formats:
      - deb

homebrew_casks:
  - name: cull
    repository:
      owner: legostin
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/legostin/cull"
    description: "Interactive disk space analyzer for macOS and Linux"
